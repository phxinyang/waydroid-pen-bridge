[Unit]
Requires=waydroid-pen-relay.service
After=waydroid-pen-relay.service

[Service]
# Reconcile links both after a container start and after it stops.  The
# command is best-effort so a transient container teardown cannot prevent the
# container unit from completing its own lifecycle.
ExecStartPost=-/usr/local/libexec/waydroid-pen-mode sync
ExecStopPost=-/usr/local/libexec/waydroid-pen-mode sync
