name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0); empty = current ref"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf -y install \
            rpm-build rpmdevtools rsync git findutils \
            python3 systemd-rpm-macros

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
          else
            VERSION=$(grep -E '^Version:' packaging/waydroid-pen-bridge.spec | awk '{print $2}')
          fi
          RELEASE=1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=$VERSION RELEASE=$RELEASE"

      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/build-rpm.sh packaging/scripts/*.sh
          VERSION="${{ steps.ver.outputs.version }}" \
          RELEASE="${{ steps.ver.outputs.release }}" \
          OUT_DIR="${GITHUB_WORKSPACE}/dist" \
            ./packaging/build-rpm.sh

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: dist/*.rpm

  build-deb:
    name: Build DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
          else
            VERSION=$(grep -E '^Version:' packaging/waydroid-pen-bridge.spec | awk '{print $2}')
          fi
          RELEASE=1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          chmod +x packaging/build-deb.sh packaging/scripts/*.sh packaging/waydroid-pen-bridge-user-setup
          VERSION="${{ steps.ver.outputs.version }}" \
          RELEASE="${{ steps.ver.outputs.release }}" \
          OUT_DIR="${GITHUB_WORKSPACE}/dist" \
            ./packaging/build-deb.sh

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb

  release:
    name: GitHub Release
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.rpm' -o -name '*.deb' \) -exec cp -a {} dist/ \;
          ls -la dist
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$REF" != v* ]]; then
            REF="v$(grep -E '^Version:' packaging/waydroid-pen-bridge.spec | awk '{print $2}')"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          {
            echo "## waydroid-pen-bridge ${REF}"
            echo
            echo "### Install"
            echo
            echo "**Fedora / RHEL-like**"
            echo '```bash'
            echo "sudo dnf install ./waydroid-pen-bridge-*.noarch.rpm"
            echo "waydroid-pen-bridge-user-setup   # after login, if tray missing"
            echo '```'
            echo
            echo "**Debian / Ubuntu**"
            echo '```bash'
            echo "sudo apt install ./waydroid-pen-bridge_*.deb"
            echo "waydroid-pen-bridge-user-setup"
            echo '```'
            echo
            echo "Requires [\`xiaomi-sheng-thp\`](https://github.com/ianchb/xiaomi-sheng-thp) separately."
            echo "Reboot once after first install when possible."
          } > dist/RELEASE_NOTES.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.rpm
            dist/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
